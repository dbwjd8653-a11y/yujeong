name: E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1) 테스트 실행 ────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [edge, chrome]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Install Edge
        if: matrix.browser == 'edge'
        uses: browser-actions/setup-edge@latest

      - name: Install Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@latest

      - name: Run tests
        env:
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_PW: ${{ secrets.TEST_USER_PW }}
          # 파괴적 mypage 테스트(비번 변경/탈퇴)가 edge·chrome 병렬 잡에서
          # 같은 계정을 동시에 건드리면 레이스로 깨지므로 브라우저별 전용 계정을 주입한다.
          # (코드는 기존 env 변수명 그대로 사용 — 로컬 .env 단일 계정도 무변경)
          MYPAGE_USER_ID: ${{ matrix.browser == 'edge' && secrets.MYPAGE_USER_ID_EDGE || secrets.MYPAGE_USER_ID_CHROME }}
          MYPAGE_USER_PW: ${{ matrix.browser == 'edge' && secrets.MYPAGE_USER_PW_EDGE || secrets.MYPAGE_USER_PW_CHROME }}
          MYPAGE_USER_NAME: ${{ matrix.browser == 'edge' && secrets.MYPAGE_USER_NAME_EDGE || secrets.MYPAGE_USER_NAME_CHROME }}
          MYPAGE_NEW_PASSWORD: ${{ secrets.MYPAGE_NEW_PASSWORD }}
          NON_ADMIN_USER_ID: ${{ secrets.NON_ADMIN_USER_ID }}
          NON_ADMIN_USER_PW: ${{ secrets.NON_ADMIN_USER_PW }}
          # Jira 실패 자동 등록은 비활성(--jira 미사용) — 코드는 유지하되 CI에선 끔.
        run: |
          python -m pytest tests/ \
            --override-ini="addopts=-v -s --tb=short --alluredir=allure-results --clean-alluredir --continue-on-collection-errors" \
            -m "not slow and not xfail" \
            --browser ${{ matrix.browser }}

      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 7

  # ── 2) Allure 리포트 → GitHub Pages 배포 ─────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: test
    # 이 워크플로는 main push와 수동 실행(workflow_dispatch)에서만 동작하며, 배포는 main에서만 한다.
    if: ${{ always() && github.ref_name == 'main' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download allure-results (all browsers)
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results/
          merge-multiple: true

      - name: Restore allure history cache
        uses: actions/cache@v4
        with:
          path: allure-history/
          key: allure-history-${{ github.ref_name }}

      - name: Install Allure CLI
        run: |
          wget -qO allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          sudo tar -xzf allure.tgz -C /opt
          sudo ln -s /opt/allure-2.27.0/bin/allure /usr/local/bin/allure

      - name: Generate Allure report
        run: python scripts/ci_allure.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── 3) Discord 알림 ───────────────────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      # 브라우저별 하위 폴더로 분리 다운로드(merge 안 함) — ci_notify가 폴더별로
      # historyId 재시도를 최종 1건으로 병합해 집계하기 위함(교차 합산 붕괴 방지).
      - name: Download allure-results (all browsers)
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results/
        continue-on-error: true

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CI_PROJECT_NAME: ${{ github.repository }}
          CI_COMMIT_BRANCH: ${{ github.ref_name }}
          GITLAB_USER_NAME: ${{ github.actor }}
          CI_COMMIT_TITLE: ${{ github.event.head_commit.message }}
          CI_PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/ci_notify.py
