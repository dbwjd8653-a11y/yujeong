name: E2E Tests

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ── 1) 테스트 실행 ────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Install Firefox & geckodriver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y firefox-esr
          which firefox-esr || which firefox

      - name: Run tests
        env:
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_PW: ${{ secrets.TEST_USER_PW }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          python -m pytest tests/ \
            --override-ini="addopts=-v -s --tb=short --alluredir=allure-results --clean-alluredir --continue-on-collection-errors" \
            -m "not slow and not xfail"

      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

  # ── 2) Allure 리포트 → GitHub Pages 배포 ─────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Restore allure history cache
        uses: actions/cache@v4
        with:
          path: allure-history/
          key: allure-history-${{ github.ref_name }}

      - name: Generate Allure report
        run: |
          pip install allure-pytest
          python scripts/ci_allure.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── 3) Discord 알림 ───────────────────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Download allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/
        continue-on-error: true

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CI_PROJECT_NAME: ${{ github.repository }}
          CI_COMMIT_BRANCH: ${{ github.ref_name }}
          GITLAB_USER_NAME: ${{ github.actor }}
          CI_COMMIT_TITLE: ${{ github.event.head_commit.message }}
          CI_PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/ci_notify.py
