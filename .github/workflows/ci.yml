name: CI

on:
  push:
    branches:
      - main
      - develop

jobs:
  # 1) 테스트 실행
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r config/requirements.txt

      - name: 테스트 실행
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -m pytest tests/ --jira --override-ini="addopts=-v -s --tb=short --alluredir=allure-results --clean-alluredir --continue-on-collection-errors" -m "not slow and not xfail"

      - name: Allure 결과 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

  # 2) Allure 리포트 생성
  pages:
    runs-on: ubuntu-latest
    needs: run_tests
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r config/requirements.txt

      - name: Allure 결과 다운로드
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Allure 리포트 생성
        run: python scripts/ci_allure.py

      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

  # 3) Discord 알림
  notify_discord:
    runs-on: ubuntu-latest
    needs: [run_tests, pages]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r config/requirements.txt

      - name: Allure 결과 다운로드
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Discord 알림 전송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/ci_notify.py